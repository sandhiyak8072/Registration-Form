<!DOCTYPE html>
<html>
<head>
    <title>Form Validation</title>
  <link rel="icon" type="image/x-icon" href="form image.jpg">
    <style>
        body {
            font-family: Arial;
            margin: 30px;
        }

        form {
            width: 350px;
            margin-bottom: 30px;
            padding: 20px;
            border: 1px solid red;
        }

        input, textarea, select {
            width: 100%;
            margin: 8px 0;
            padding: 8px;
        }

        button {
            padding: 10px 20px;
        }

        .error {
            color: pink;
        }

        .success {
            color: green;
        }
    </style>
</head>

<body>

    
    <h2>Registration Form</h2>
  
    <form id="registerForm">

        <input type="text" id="regName" placeholder="Enter Name">

        <input type="email" id="regEmail" placeholder="Enter Email">

        <input type="password" id="regPassword" placeholder="Enter Password">

        <input type="password" id="confirmPassword"
               placeholder="Confirm Password">

        <button type="submit">Register</button>

        <p id="registerMessage"></p>
    </form>


    <!-- Login Form -->
    <h2>Login Form</h2>

    <form id="loginForm">

        <input type="email" id="loginEmail"
               placeholder="Enter Email">

        <input type="password" id="loginPassword"
               placeholder="Enter Password">

        <button type="submit">Login</button>

        <p id="loginMessage"></p>
    </form>


    <!-- Feedback Form -->
    <h2>Feedback Form</h2>

    <form id="feedbackForm">

        <input type="text" id="feedbackName"
               placeholder="Enter Name">

        <select id="rating">
            <option value="">Select Rating</option>
            <option value="*"> * Poor</option>
            <option value="*"> * Average</option>
            <option value="*"> * Good</option>
            <option value="*"> * Very Good</option>
            <option value="*"> *Excellent</option>
        </select>

        <textarea id="feedback"
                  placeholder="Enter your feedback"></textarea>

        <button type="submit">Submit Feedback</button>

        <p id="feedbackMessage"></p>
    </form>


    <script>


        document.getElementById("registerForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("regName").value;
            let email = document.getElementById("regEmail").value;
            let password = document.getElementById("regPassword").value;
            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let message =
                document.getElementById("registerMessage");

            
            if (name === "") {
                message.innerHTML = "Name is required.";
                message.className = "error";
                return;
            }

            if (email === "") {
                message.innerHTML = "Email is required.";
                message.className = "error";
                return;
            }

            if (password.length < 6) {
                message.innerHTML =
                    "Password must contain at least 6 characters.";
                message.className = "error";
                return;
            }

            if (password !== confirmPassword) {
                message.innerHTML =
                    "Passwords do not match.";
                message.className = "error";
                return;
            }

            message.innerHTML =
                "Registration successful!";
            message.className = "success";
        });


        

        document.getElementById("loginForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let email =
                document.getElementById("loginEmail").value;

            let password =
                document.getElementById("loginPassword").value;

            let message =
                document.getElementById("loginMessage");

            if (email === "") {
                message.innerHTML = "Please enter your email.";
                message.className = "error";
                return;
            }

            if (password === "") {
                message.innerHTML = "Please enter your password.";
                message.className = "error";
                return;
            }

            if (password.length < 6) {
                message.innerHTML =
                    "Password must be at least 6 characters.";
                message.className = "error";
                return;
            }

            message.innerHTML = "Login successful!";
            message.className = "success";
        });

        document.getElementById("feedbackForm")
            .addEventListener("submit", function(event) {

            event.preventDefault();

            let name =
                document.getElementById("feedbackName").value;

            let rating =
                document.getElementById("rating").value;

            let feedback =
                document.getElementById("feedback").value;

            let message =
                document.getElementById("feedbackMessage");


            if (name === "") {
                message.innerHTML = "Please enter your name.";
                message.className = "error";
                return;
            }

            if (rating === "") {
                message.innerHTML = "Please select a rating.";
                message.className = "error";
                return;
            }

            if (feedback === "") {
                message.innerHTML = "Please enter your feedback.";
                message.className = "error";
                return;
            }


        
            let words = feedback.trim().split(/\s+/);
            let wordCount = 0;

            for (let i = 0; i < words.length; i++) {
                if (words[i] !== "") {
                    wordCount++;
                }
            }

            if (wordCount < 3) {
                message.innerHTML =
                    "Feedback must contain at least 3 words.";
                message.className = "error";
                return;
            }

            message.innerHTML =
                "Feedback submitted successfully!";
            message.className = "success";
        });

    </script>

</body>
</html>
